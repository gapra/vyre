<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button — Vyre Examples</title>
  <link rel="stylesheet" href="_preview.css">
  <link rel="stylesheet" href="button.css">
</head>
<body>
<div class="demo-page">

  <header class="demo-header">
    <p class="demo-header__eyebrow">@gapra/vyre-skill</p>
    <h1 class="demo-header__title">Button</h1>
    <p class="demo-header__desc">Primary action trigger. Four variants, three sizes, loading and icon states.</p>
  </header>

  <!-- Variants -->
  <section class="demo-section">
    <p class="demo-section__label">Variants</p>
    <div class="demo-row">
      <button class="btn btn--primary" type="button">Save changes</button>
      <button class="btn btn--secondary" type="button">Cancel</button>
      <button class="btn btn--ghost" type="button">Learn more</button>
      <button class="btn btn--destructive" type="button">Delete account</button>
    </div>
  </section>

  <hr class="demo-divider">

  <!-- Sizes -->
  <section class="demo-section">
    <p class="demo-section__label">Sizes</p>
    <div class="demo-row">
      <button class="btn btn--primary btn--sm" type="button">Small</button>
      <button class="btn btn--primary" type="button">Medium</button>
      <button class="btn btn--primary btn--lg" type="button">Large</button>
    </div>
  </section>

  <hr class="demo-divider">

  <!-- States -->
  <section class="demo-section">
    <p class="demo-section__label">States</p>
    <div class="demo-row">
      <button class="btn btn--primary" type="button">Default</button>
      <button class="btn btn--primary" type="button" disabled aria-disabled="true">Disabled</button>
      <button class="btn btn--primary btn--loading" type="button" aria-busy="true">
        <span class="btn__spinner" aria-hidden="true"></span>
        <span>Processing…</span>
      </button>
    </div>
  </section>

  <hr class="demo-divider">

  <!-- Icon buttons -->
  <section class="demo-section">
    <p class="demo-section__label">With icon</p>
    <div class="demo-row">
      <button class="btn btn--primary btn--icon-left" type="button">
        <svg class="btn__icon" aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 2a.75.75 0 0 1 .75.75V7.25h4.5a.75.75 0 0 1 0 1.5H8.75v4.5a.75.75 0 0 1-1.5 0V8.75H2.75a.75.75 0 0 1 0-1.5H7.25V2.75A.75.75 0 0 1 8 2z"/>
        </svg>
        Add item
      </button>
      <button class="btn btn--secondary btn--icon-left" type="button">
        <svg class="btn__icon" aria-hidden="true" viewBox="0 0 16 16" fill="currentColor">
          <path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61z"/>
        </svg>
        Edit
      </button>
      <button class="btn btn--ghost btn--icon-only" type="button" aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="currentColor" style="width:16px;height:16px">
          <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/>
        </svg>
      </button>
    </div>
  </section>

  <hr class="demo-divider">

  <!-- Button group -->
  <section class="demo-section">
    <p class="demo-section__label">Button group</p>
    <div class="demo-row">
      <div class="btn-group" role="group" aria-label="Text alignment">
        <button class="btn btn--secondary" type="button" aria-pressed="true">Left</button>
        <button class="btn btn--secondary" type="button" aria-pressed="false">Center</button>
        <button class="btn btn--secondary" type="button" aria-pressed="false">Right</button>
      </div>
    </div>
  </section>

</div>
</body>
</html>
